servers:
  context7:
    description: Documentation lookup MCP.
    type: remote
    transport: http
    url: https://mcp.context7.com/mcp/oauth
  qmd:
    description: Local markdown knowledge base MCP.
    type: local
    command: [qmd, mcp]
  shadcn:
    description: Official shadcn/ui registry MCP server.
    type: local
    transport: stdio
    command: [shadcn, mcp]
  fff:
    description: Local fast file finder MCP.
    type: local
    command: [fff-mcp]
  deepwiki:
    description: Repository documentation and implementation detail MCP.
    type: remote
    transport: http
    url: https://mcp.deepwiki.com/mcp
  openai-docs:
    description: OpenAI developer documentation MCP server.
    type: remote
    transport: http
    url: https://developers.openai.com/mcp
  pinescript-docs:
    description: Pine Script documentation MCP server.
    type: local
    command: [npx, -y, pinescript-mcp-server]
  aws-knowledge:
    description: AWS knowledge MCP server.
    type: remote
    transport: http
    url: https://knowledge-mcp.global.api.aws
  jira:
    description: Jira MCP server.
    type: remote
    transport: http
    url: https://mcp.atlassian.com/v1/mcp/authv2
  confluence:
    description: Confluence MCP server.
    type: remote
    transport: http
    url: https://mcp.atlassian.com/v1/mcp/authv2
  datadog:
    description: Datadog MCP server.
    type: remote
    transport: http
    url: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
  homeassistant:
    description: Home Assistant MCP server (ha-mcp-web).
    type: remote
    transport: http
    url: http://192.168.30.39:9583/{env:HA_MCP_SECRET_PATH}
  paper:
    description: Paper.design visual HTML/CSS design canvas MCP server (Paper Desktop).
    type: remote
    transport: http
    url: http://127.0.0.1:29979/mcp
  unifi-network:
    description: UniFi Network MCP server for managing the UniFi gateway, networks, clients, and firewall.
    type: local
    transport: stdio
    command: [unifi-network-mcp]
    env:
      UNIFI_NETWORK_HOST: "{env:UNIFI_NETWORK_HOST}"
      UNIFI_NETWORK_USERNAME: "{env:UNIFI_NETWORK_USERNAME}"
      UNIFI_NETWORK_PASSWORD: "{env:UNIFI_NETWORK_PASSWORD}"
  truenas:
    description: TrueNAS MCP server for storage, datasets, shares, apps, monitoring, and maintenance.
    type: local
    transport: stdio
    command: [truenas-mcp]
    env:
      TRUENAS_URL: "{env:TRUENAS_URL}"
      TRUENAS_API_KEY: "{env:TRUENAS_API_KEY}"
  x-docs:
    description: X API documentation search MCP server (hosted).
    type: remote
    transport: http
    url: https://docs.x.com/mcp
  exa:
    description: Exa AI web search MCP server (web_search_exa, web_fetch_exa).
    type: remote
    transport: http
    url: https://mcp.exa.ai/mcp
    headers:
      x-api-key: "{env:EXA_API_KEY}"
  exa-research:
    description: Exa AI web search MCP server including web_search_advanced_exa tool.
    type: remote
    transport: http
    url: https://mcp.exa.ai/mcp?tools=web_search_advanced_exa
    headers:
      x-api-key: "{env:EXA_API_KEY}"
  forge:
    description: Tyler Forge design system MCP server (components, design tokens, icons, API validation).
    type: local
    transport: stdio
    command: [npx, -y, "@tylertech/forge-mcp@latest"]
  robinhood:
    description: Robinhood Trading MCP server.
    type: remote
    transport: http
    url: https://agent.robinhood.com/mcp/trading
  sentry:
    description: Sentry issue, event, and trace investigation MCP server.
    type: remote
    transport: http
    url: https://mcp.sentry.dev/mcp
  cloudflare:
    description: Cloudflare API MCP server.
    type: remote
    transport: http
    url: https://mcp.cloudflare.com/mcp
  cloudflare-docs:
    description: Cloudflare documentation MCP server.
    type: remote
    transport: http
    url: https://docs.mcp.cloudflare.com/mcp
  browser-control:
    description: Browser Control MCP server for visible Chromium browser automation.
    type: local
    transport: stdio
    command: [browser-control-mcp]
  agent-browser:
    description: First-party browser automation MCP server for interaction, screenshots, and diagnostics.
    type: local
    transport: stdio
    command: [agent-browser, mcp, --tools, all]
  terminal-control:
    description: Terminal Control MCP server for existing termctrl sessions.
    type: local
    transport: stdio
    command: [termctrl, mcp]
  pencil:
    description: Pencil (pen.dev) desktop app MCP server, hosted by the Windows supergateway bridge.
    type: remote
    transport: http
    url: http://192.168.1.99:7610/mcp
  discord:
    description: Send plain-text messages to configured Discord destinations.
    type: remote
    transport: http
    url: http://127.0.0.1:29980/mcp
  openpencil:
    description: OpenPencil design editor MCP trial endpoint.
    type: remote
    transport: http
    url: http://127.0.0.1:7601/mcp
  cairn:
    description: Cairn artifact catalog of efforts, sessions, and the files they produce.
    type: local
    transport: stdio
    command: [node, /home/mark/workspace/repos/mfz-home/packages/cairn/src/mcp.ts]
