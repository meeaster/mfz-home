servers:
  github:
    description: Official GitHub remote MCP server using the local GitHub CLI credential.
    type: remote
    transport: http
    url: https://api.githubcopilot.com/mcp/
    # The dev .zshrc and opencode-serve.service set GITHUB_MCP_TOKEN from `gh auth token`, so the
    # OpenCode service sees the current GitHub CLI credential after a restart.
    headers:
      Authorization: "Bearer {env:GITHUB_MCP_TOKEN}"
      X-MCP-Toolsets: "default,actions"
  context7:
    description: Documentation lookup MCP.
    type: remote
    transport: http
    url: https://mcp.context7.com/mcp/oauth
    opencode: { pool: true }
  shadcn:
    description: Official shadcn/ui registry MCP server.
    type: local
    transport: stdio
    command: [shadcn, mcp]
    opencode: { pool: true, cwd: "~" }
  deepwiki:
    description: Repository documentation and implementation detail MCP.
    type: remote
    transport: http
    url: https://mcp.deepwiki.com/mcp
  openai-docs:
    description: OpenAI developer documentation MCP server.
    type: remote
    transport: http
    url: https://developers.openai.com/mcp
    opencode: { pool: true }
  pinescript-docs:
    description: Pine Script documentation MCP server.
    type: local
    command: [npx, -y, pinescript-mcp-server]
  aws-knowledge:
    description: AWS knowledge MCP server.
    type: remote
    transport: http
    url: https://knowledge-mcp.global.api.aws
  homeassistant:
    description: Home Assistant MCP server (ha-mcp-web).
    type: remote
    transport: http
    url: http://192.168.30.39:9583/{env:HA_MCP_SECRET_PATH}
    opencode: { pool: true }
  paper:
    description: Paper.design visual HTML/CSS design canvas MCP server (Paper Desktop).
    type: remote
    transport: http
    url: http://127.0.0.1:29979/mcp
  doop:
    description: Doop multiplayer HTML design canvas MCP server (self-hosted).
    type: remote
    transport: http
    # Must match the Doop instance's BETTER_AUTH_URL, which its OAuth metadata names; a profile
    # that reaches Doop elsewhere overrides url. Each agent signs in once in the browser.
    url: http://localhost:4400/mcp
  executor:
    description: Executor 2 local server, which runs apps, schedules, triggers, and workflows over connected accounts.
    type: remote
    transport: http
    # Served by executor.service; each agent signs in once through Executor's browser OAuth.
    url: http://127.0.0.1:4312/mcp
    opencode: { pool: true }
  executor-lab:
    description: Executor in the eks-lab cluster (repos/eks-lab), the self-hosted server behind Floci's ALB with Dex SSO.
    type: remote
    transport: http
    # Floci's local CA signs its certificate; each agent signs in once through Executor's browser OAuth.
    url: https://executor.localhost:18443/mcp
    opencode: { pool: true }
  unifi-network:
    description: UniFi Network MCP server for managing the UniFi gateway, networks, clients, and firewall.
    type: local
    transport: stdio
    # Reads UNIFI_NETWORK_HOST, UNIFI_NETWORK_USERNAME, and UNIFI_NETWORK_PASSWORD from the inherited environment.
    # OpenCode's {env:...} syntax is not expanded by other harnesses, and Codex does not inherit them.
    command: [unifi-network-mcp]
    opencode: { pool: true, cwd: "~" }
  x-docs:
    description: X API documentation search MCP server (hosted).
    type: remote
    transport: http
    url: https://docs.x.com/mcp
    opencode: { pool: true }
  exa:
    description: Exa AI web search MCP server (web_search_exa, web_fetch_exa).
    type: remote
    transport: http
    url: https://mcp.exa.ai/mcp
    headers:
      x-api-key: "{env:EXA_API_KEY}"
  exa-research:
    description: Exa AI web search MCP server including web_search_advanced_exa tool.
    type: remote
    transport: http
    url: https://mcp.exa.ai/mcp?tools=web_search_advanced_exa
    headers:
      x-api-key: "{env:EXA_API_KEY}"
  robinhood:
    description: Robinhood Trading MCP server.
    type: remote
    transport: http
    url: https://agent.robinhood.com/mcp/trading
    opencode: { pool: true }
  sentry:
    description: Sentry issue, event, and trace investigation MCP server.
    type: remote
    transport: http
    url: https://mcp.sentry.dev/mcp
    opencode: { pool: true }
  cloudflare:
    description: Cloudflare API MCP server.
    type: remote
    transport: http
    url: https://mcp.cloudflare.com/mcp
    opencode: { pool: true }
  cloudflare-docs:
    description: Cloudflare documentation MCP server.
    type: remote
    transport: http
    url: https://docs.mcp.cloudflare.com/mcp
    opencode: { pool: true }
  # `mise run browse:install` installs the binary; its relay auto-updates it in place. Use its full path because
  # xdg-utils ships an unrelated /usr/bin/browse.
  browse:
    description: Browse MCP server for driving the user's Chromium browser through the Browse extension.
    type: local
    transport: stdio
    command: [~/.local/bin/browse, mcp]
    opencode: { pool: true, cwd: "~" }
  agent-browser:
    description: First-party browser automation MCP server for interaction, screenshots, and diagnostics.
    type: local
    transport: stdio
    command: [agent-browser, mcp, --tools, all]
  terminal-control:
    description: Terminal Control MCP server for existing termctrl sessions.
    type: local
    transport: stdio
    command: [termctrl, mcp]
