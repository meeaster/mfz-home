<!doctype html><meta charset=utf-8><title>Component diagrams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=block">
<style>
:root { color-scheme: dark; --bg:#282a36; --surface:#21222c; --alt:#44475a; --fg:#f8f8f2; --muted:#a3a8c3; --line:#c6c8d8;
  --neutral: color-mix(in srgb, #a3a8c3 60%, #282a36); --gl: color-mix(in srgb, #a3a8c3 11%, transparent);
  --cyan:#8be9fd; --purple:#bd93f9; --pink:#ff79c6; --green:#50fa7b; --orange:#ffb86c; --yellow:#f1fa8c; --red:#ff5555; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
main { max-width:1500px; margin:0 auto; padding:20px; display:grid; grid-template-columns: repeat(auto-fill, minmax(720px, 1fr)); gap:24px; align-items:start; }
h1 { grid-column: 1 / -1; margin: 0; font-size: 22px; } .lead { grid-column: 1/-1; margin: -14px 0 0; color: var(--muted); }
.card { border: 1px solid var(--alt); border-radius: 12px; padding: 14px; }
h3 { margin: 0 0 2px; font-size: 16px; } .card > p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.fig svg { display:block; max-width:100%; height:auto; margin: 0 auto;
  --pele-bg:var(--bg); --pele-fg:var(--fg); --pele-muted:var(--muted); --pele-line:var(--line);
  --pele-surface:var(--surface); --pele-surface-alt:var(--alt); --pele-border:var(--neutral); --pele-accent:var(--pink);
  --pele-font: "Segoe UI", Arial, sans-serif; }

  .fig { border-radius: 10px; padding: 14px; background-color: var(--bg);
    background-image: radial-gradient(color-mix(in srgb, var(--muted) 32%, transparent) 1px, transparent 1.3px); background-size: 24px 24px; }
  .fig.plain { background-image: none; }
  .fig svg { --pele-radius: 10px; }
  .fig .pele-node :is(rect, polygon, path, circle, ellipse):not(.pele-icon *) { fill: var(--bg); stroke: var(--neutral); stroke-width: 1.6; }
  .fig .pele-subtitled .pele-label tspan:first-child { font-weight: 700; }
  .fig .pele-subtitled .pele-label tspan:nth-child(2) { font-size: 12px; fill: var(--muted); }
  .fig .pele-edges { stroke: var(--line); } .fig .pele-marker { fill: var(--line); }
  .fig .pele-edge-label text, .fig .pele-cluster-label, .fig .pele-frame-label { font-family: Kalam, "Segoe Print", cursive; font-size: 17px; }
  .fig .pele-edge-label rect { fill: var(--bg); }
  .fig .pele-cluster rect { fill: none; stroke: var(--neutral); stroke-width: 2; rx: 28px; filter: url(#lasso); }
  .fig .pele-bars rect { fill: var(--bg); stroke: var(--neutral); stroke-width: 1.6; }
  .fig .pele-annotation { font-family: Kalam, "Segoe Print", cursive; font-size: 17px; fill: var(--muted); }
  .fig .pele-annotation-line { stroke: var(--muted); stroke-width: 1.4; }
  .fig .pele-annotation-emphasis { fill: var(--pink); } .fig .pele-annotation-emphasis-line { stroke: var(--pink); }
  .fig text.pele-literal { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; }
  .fig .pele-state-composite > path { display: none; } /* a group is its loop and label; no title rule */
  .fig .pele-state-start circle, .fig .pele-state-end circle { fill: var(--muted); stroke: none; }
  .fig .pele-lifeline { stroke: var(--neutral); }
.flow [data-id=z1] > rect { stroke: var(--cyan); } .flow [data-id=z1] .pele-cluster-label { fill: var(--cyan); }
.flow [data-id=z2] > rect { stroke: var(--purple); } .flow [data-id=z2] .pele-cluster-label { fill: var(--purple); }
.flow [data-id=z3] > rect { stroke: var(--yellow); } .flow [data-id=z3] .pele-cluster-label { fill: var(--yellow); }
.flow [data-id="opw"] :is(rect, polygon, path, circle):not(.pele-icon *, .pele-icon-tile) { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); }
    .flow [data-id="opw"] .pele-label tspan:first-child, .flow [data-id="opw"] .pele-label { fill: var(--pink); }
    .flow .pele-activation[data-id="opw"] { fill: var(--pink); stroke: none; }
.flow [data-id="arch"] :is(rect, path) { stroke-dasharray: 5 4; } .flow [data-id="arch"] .pele-label tspan { fill: var(--muted) !important; } .flow [data-id="arch"] .pele-marker { fill: var(--muted); }
.flow [data-id="L_opw_arch_0"] :is(rect, path) { stroke-dasharray: 5 4; } .flow [data-id="L_opw_arch_0"] .pele-label tspan { fill: var(--muted) !important; } .flow [data-id="L_opw_arch_0"] .pele-marker { fill: var(--muted); }
.seq [data-id="W"] :is(rect, polygon, path, circle):not(.pele-icon *, .pele-icon-tile) { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); }
    .seq [data-id="W"] .pele-label tspan:first-child, .seq [data-id="W"] .pele-label { fill: var(--pink); }
    .seq .pele-activation[data-id="W"] { fill: var(--pink); stroke: none; }
.seq .pele-frame rect:first-child { stroke: var(--cyan); stroke-width: 2; rx: 22px; filter: url(#lasso); }
    .seq .pele-frame rect:nth-child(2) { fill: none; stroke: none; } .seq .pele-frame-kind { fill: var(--cyan); font-family: Kalam, "Segoe Print", cursive; font-size: 15px; }
.seq .pele-note rect { fill: var(--bg); stroke: none; } .seq .pele-note text { fill: var(--pink); font-style: italic; font-family: "Palatino Linotype", Georgia, serif; font-size: 15px; }
.state [data-id="Degraded"] :is(rect, polygon, path, circle) { stroke: var(--orange); }
    .state [data-id="Degraded"] .pele-label tspan:first-child, .state [data-id="Degraded"] .pele-label { fill: var(--orange); stroke: none; font-weight: 700; } .state [data-id="Degraded"] { stroke: var(--orange); } .state [data-id="Degraded"] .pele-marker { fill: var(--orange); }
.state .pele-state-composite > rect { stroke: var(--cyan); } .state .pele-state-composite .pele-cluster-label { fill: var(--cyan); }
.er [data-id="PIPELINE"] :is(rect, polygon, path, circle):not(.pele-icon *, .pele-icon-tile) { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); }
    .er [data-id="PIPELINE"] .pele-label tspan:first-child, .er [data-id="PIPELINE"] .pele-label { fill: var(--pink); }
    .er .pele-activation[data-id="PIPELINE"] { fill: var(--pink); stroke: none; }
.git svg { --pele-series-1: var(--muted); --pele-series-2: var(--cyan); --pele-series-3: var(--purple); }
.git .pele-branch[data-id="main"] > rect { fill: var(--bg); stroke: var(--muted); stroke-width: 1.6; } .git .pele-branch[data-id="main"] > text { fill: var(--muted); font-weight: 700; }
.git .pele-branch[data-id="opw-prototype"] > rect { fill: var(--bg); stroke: var(--cyan); stroke-width: 1.6; } .git .pele-branch[data-id="opw-prototype"] > text { fill: var(--cyan); font-weight: 700; }
.git .pele-branch[data-id="pipeline"] > rect { fill: var(--bg); stroke: var(--purple); stroke-width: 1.6; } .git .pele-branch[data-id="pipeline"] > text { fill: var(--purple); font-weight: 700; }
.timeline .pele-period rect, .timeline .pele-event rect { fill: var(--bg) !important; fill-opacity: 1 !important; stroke: var(--neutral); stroke-width: 1.5; }
    .timeline .pele-period text, .timeline .pele-event text { fill: var(--fg) !important; } .timeline .pele-period text { font-weight: 700; }
    .timeline [data-id="Watchtower"] rect { stroke: var(--pink) !important; stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)) !important; }
    .timeline [data-id="Watchtower"] text { fill: var(--pink) !important; }
    .timeline .pele-dot { fill: var(--muted); } .timeline .pele-axis { stroke: var(--neutral); }
.arch [data-id=vpc] > rect { stroke: var(--cyan); } .arch [data-id=vpc] .pele-cluster-label { fill: var(--cyan); }
.arch [data-id=eks] > rect { stroke: var(--purple); } .arch [data-id=eks] .pele-cluster-label { fill: var(--purple); }
.arch [data-id="opw"] :is(rect, polygon, path, circle):not(.pele-icon *, .pele-icon-tile) { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); }
    .arch [data-id="opw"] .pele-label tspan:first-child, .arch [data-id="opw"] .pele-label { fill: var(--pink); }
    .arch .pele-activation[data-id="opw"] { fill: var(--pink); stroke: none; }
.xy .pele-bars rect[data-id=bar-4] { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); }
.mind .pele-section-2 > .pele-node > rect { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); } .mind .pele-section-2 > .pele-shape-branch .pele-label { fill: var(--pink); font-weight: 700; } .mind .pele-section-2 > .pele-edges { stroke: var(--pink); }

</style>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="lasso" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="1100"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="8"/></filter>
</defs></svg>
<style>
.terms [data-id=z1] > rect { stroke: var(--cyan); } .terms [data-id=z1] .pele-cluster-label { fill: var(--cyan); }
.terms [data-id=z2] > rect { stroke: var(--purple); } .terms [data-id=z2] .pele-cluster-label { fill: var(--purple); }
.terms [data-id=z3] > rect { stroke: var(--yellow); } .terms [data-id=z3] .pele-cluster-label { fill: var(--yellow); }
.terms [data-id="opw"] :is(rect, polygon, path, circle):not(.pele-icon *, .pele-icon-tile) { stroke: var(--pink); stroke-width: 2.4; fill: color-mix(in srgb, var(--pink) 14%, var(--bg)); }
.terms .pele-cluster-label .num { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; }
.terms [data-id="opw"] .pele-label tspan:first-child, .terms [data-id="opw"] .pele-label { fill: var(--pink); }
</style>
<main><h1>Component diagrams</h1>

 d="M124.46,156L121.1,148L127.82,148Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_nlb_opw_0"><path d="M179.56,192L309.91,192"/><path class="pele-marker" d="M316.91,192L308.91,195.36L308.91,188.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_opw_dd_0"><path d="M391.14,184L431.14,184C449.14,184 449.14,132.17 467.14,132.17L500.14,132.17"/><path class="pele-marker" d="M507.14,132.17L499.14,135.53L499.14,128.81Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_opw_s3_0"><path d="M391.14,200L431.14,200C449.14,200 449.14,251.83 467.14,251.83L500.14,251.83"/><path class="pele-marker" d="M507.14,251.83L499.14,255.19L499.14,248.47Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium pele-subtitled" data-id="agent" transform="translate(124.46,84)"><rect x="-96.46" y="-36" width="192.91" height="72" rx="36" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Agent</tspan><tspan x="0" y="17.6">customer-0 server</tspan></text></g><g class="pele-node pele-shape-rect pele-subtitled" data-id="nlb" transform="translate(124.46,192)"><rect x="-55.1" y="-36" width="110.21" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">NLB</tspan><tspan x="0" y="17.6">443 · TLS</tspan></text></g><g class="pele-node pele-shape-rect pele-subtitled" data-id="opw" transform="translate(354.02,192)"><rect x="-37.11" y="-36" width="74.22" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">OPW</tspan><tspan x="0" y="17.6">pod</tspan></text></g><g class="pele-node pele-shape-fr-rect pele-subtitled" data-id="dd" transform="translate(583.38,132.17)"><rect x="-76.25" y="-36" width="152.5" height="72" fill="va </div></section>
