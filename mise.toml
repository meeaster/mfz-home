# Cairn is developed in its own checkout, and the profiles load its plugin and skills from there. This task clones
# the checkout, installs its dependencies, and links its commands into ~/.local/bin, which is on PATH for shells and
# for the OpenCode service. Cairn runs from source, so edits apply when OpenCode or the command next starts.

[vars]
cairn = "{{env.HOME}}/workspace/repos/cairn"

[tasks."cairn:install"]
description = "Clone Cairn if needed, install its dependencies, and link its commands"
run = '''
set -eu
cairn="{{vars.cairn}}"
[ -d "$cairn" ] || gh repo clone meeaster/cairn "$cairn"
pnpm --dir "$cairn" install --frozen-lockfile
mkdir -p "$HOME/.local/bin"
ln -sfn "$cairn/bin/cairn.js" "$HOME/.local/bin/cairn"
ln -sfn "$cairn/bin/cairn-mcp.js" "$HOME/.local/bin/cairn-mcp"
'''
