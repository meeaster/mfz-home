blockExoticSubdeps: true
trustPolicy: allow
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: true
packages:
  - mcp/*
  - opencode/plugins/omp-advisor
  - opencode/plugins/pstack
  - opencode/plugins/session-cost-tui
  - opencode/plugins/subagent-usage
  - opencode/plugins/work-ledger
minimumReleaseAgeExclude:
  - '@opencode-ai/*'
  - '@opentui/*'
