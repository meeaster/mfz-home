blockExoticSubdeps: true
trustPolicy: off
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
packages:
  # Executor apps install here only for type checking; Executor builds them itself.
  - executor/apps/*
  - mcp/*
  - relays/*
  - opencode/plugins/active/*
  - opencode/plugins/in-progress/*
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@opencode/*'
  - '@opentui/*'
