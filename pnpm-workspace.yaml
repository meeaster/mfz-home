blockExoticSubdeps: true
trustPolicy: off
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
packages:
  - mcp/*
  - opencode/plugins/active/*
  - opencode/plugins/in-progress/*
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@opencode/*'
  - '@opentui/*'
