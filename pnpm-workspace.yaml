blockExoticSubdeps: true
trustPolicy: off
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
packages:
  - mcp/*
  - opencode/plugins/omp-advisor
  - opencode/plugins/optchat
  - opencode/plugins/handoff-tui
  - opencode/plugins/pstack
  - opencode/plugins/session-usage-tui
  - opencode/plugins/session-usage
  - opencode/plugins/session-context
  - opencode/plugins/skill-continuity
  - opencode/plugins/work-ledger
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@opencode/*'
  - '@opentui/*'
