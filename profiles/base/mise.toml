[tools]
node = "26"
bun = "1.4"
go = "1"
python = "3.14"
# mise cannot pass rustup's --no-self-update, and a failed rustup self-update fails an otherwise successful toolchain upgrade.
rust = { version = "1", postinstall = "rustup set auto-self-update disable" }
zig = "0.17"
"cargo:terminal-control" = { version = "1", postinstall = "mfz skills refresh --tool cargo:terminal-control || echo 'terminal-control: skill refresh failed; rerun mfz skills refresh' >&2" }
aws-cli = "2"
aws-sam-cli = "1"
terraform = "1.16"
kind = "0"
gh = "2"
# A new release can change the server protocol, so stop the old server before bootstrapping plugins; `server stop` bypasses the protocol guard, and no server may be running.
herdr = { version = "0", postinstall = 'herdr server stop >/dev/null 2>&1 || true; bash "$HOME/.local/bin/bootstrap-herdr-plugins"' }
jq = "1"
pipx = "1"
pre-commit = "4"
ripgrep = "15"
uv = "0"
pnpm = "12"
actionlint = "1"
zizmor = "1"
shellcheck = "0"
sqlite = "3"
shfmt = "3"
"npm:oxlint" = "1"
"npm:@oxlint/plugins" = "1"
"npm:oxfmt" = "0"
tflint = "0"
yamllint = "1"
"npm:ccstatusline" = "2"
"npm:aws-cdk" = "2"
# The firewall binary itself, pinned; ~/.local/bin/mise-guard/mise routes installs through it.
"github:SocketDev/sfw-free" = { version = "1", bin = "sfw" }
"npm:@open-pencil/mcp" = "0"
"npm:@open-pencil/cli" = "0"
"npm:shadcn" = { version = "4", postinstall = "mfz skills refresh --tool npm:shadcn || echo 'shadcn: skill refresh failed; rerun mfz skills refresh' >&2" }
"npm:executor" = "2.0.0-beta.33"
# Tool skills follow the installed version; a failed refresh must not fail the install.
"npm:@fission-ai/openspec" = { version = "1", postinstall = "mfz skills refresh --tool npm:@fission-ai/openspec || echo 'openspec: skill refresh failed; rerun mfz skills refresh' >&2" }
"github:kitlangton/ghui" = "0"
"npm:agent-browser" = "0"
# Refresh the unpacked extension Windows Chrome loads; a failed sync must not fail the install.
"npm:@opencode-ai/browser-control" = { version = "0", postinstall = "mise run browser-control:sync-extension || echo 'browser-control: extension sync failed; rerun mise run browser-control:sync-extension' >&2; mfz skills refresh --tool npm:@opencode-ai/browser-control || echo 'browser-control: skill refresh failed; rerun mfz skills refresh' >&2" }
"npm:opencode-drive" = { version = "2", postinstall = "mfz skills refresh --tool npm:opencode-drive || echo 'opencode-drive: skill refresh failed; rerun mfz skills refresh' >&2" }
"github:charmbracelet/glow" = "3"
bat = "0"
imagemagick = "7"
ffmpeg = "9"
"aqua:sharkdp/fd" = "10"
"pipx:git-filter-repo" = "2"
"cargo:cargo-fframes" = { version = "1", postinstall = "mfz skills refresh --tool cargo:cargo-fframes || echo 'cargo-fframes: skill refresh failed; rerun mfz skills refresh' >&2" }

[settings]
minimum_release_age = "1d"
# Skipped in non-interactive sessions, so agent-run installs never update mise mid-command.
self_update.auto = true
# Installs run only through ~/.local/bin/mise-guard/mise, which routes package downloads through sfw.
auto_install = false

[settings.npm]
package_manager = "pnpm"

[bootstrap.hooks]
pre-packages = 'bash "$HOME/.local/bin/ensure-google-chrome-apt-repository"'

[bootstrap.packages]
"apt:google-chrome-stable" = "latest"
# fframes builds: bindgen for ffmpeg-sys-fframes needs libclang; FFmpeg source builds need the assemblers,
# ninja, and codec headers; Skia links FreeType and Fontconfig; the preview window plays audio through ALSA.
"apt:libclang-dev" = { os = "linux" }
"apt:clang" = { os = "linux" }
"apt:pkg-config" = { os = "linux" }
"apt:nasm" = { os = "linux" }
"apt:yasm" = { os = "linux" }
"apt:ninja-build" = { os = "linux" }
"apt:libx264-dev" = { os = "linux" }
"apt:libx265-dev" = { os = "linux" }
"apt:libopus-dev" = { os = "linux" }
"apt:libvpx-dev" = { os = "linux" }
"apt:libfreetype-dev" = { os = "linux" }
"apt:libfontconfig-dev" = { os = "linux" }
"apt:libasound2-dev" = { os = "linux" }

[env]
IMPECCABLE_NO_TELEMETRY = "1"
IMPECCABLE_NO_UPDATE_CHECK = "1"
# fframes' prebuilt FFmpeg links x264 ABI 163 and Ubuntu 24.04 ships 164, so build FFmpeg from source.
# A project that already downloaded the prebuilt also needs `cargo clean -p ffmpeg-sys-fframes`.
FFMPEG_FORCE_BUILD = "1"
