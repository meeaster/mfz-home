mcp:
  context7:
    agents: [opencode, claude-code, codex]
  deepwiki:
    agents: [opencode, claude-code, codex]
  openai-docs:
    agents: [opencode, claude-code, codex]
  aws-knowledge:
    agents: [opencode, claude-code, codex]
opencode_v2:
  global_instructions: true
  config:
    experimental:
      subagent_depth: 2
    agent:
      agent-author:
        model: openai/gpt-5.6-sol
        variant: medium
      architect:
        model: openai/gpt-5.6-sol
        variant: medium
      explore:
        model: openai/gpt-5.6-luna
        variant: high
      operator:
        model: openai/gpt-5.6-luna
        variant: high
      triage:
        model: openai/gpt-5.6-terra
        variant: high
      prototype:
        model: openai/gpt-5.6-terra
        variant: max
      pr-reviewer:
        model: openai/gpt-5.6-sol
        variant: high
      ui-ux-designer:
        model: openai/gpt-5.6-sol
        variant: medium
  websearch:
    provider: exa
  cli:
    theme:
      name: dracula
  plugins:
    - subagent-usage
  tui_plugins:
    - session-cost-tui
  commands:
    - apply-spec
    - implement-design
    - orchestrate
    - openspec-rolling-apply
    - rmslop
  agents:
    - agent-author
    - architect
    - inspect
    - operator
    - prototype
    - pr-reviewer
    - research
    - reviewer
    - scheduled-worker
    - session-analyst
    - triage
    - worker
    - ui-ux-designer
codex:
  config:
    tui:
      status_line:
        - model-with-reasoning
        - current-dir
        - git-branch
        - context-used
        - permissions
        - approval-mode
      status_line_use_colors: true
      theme: dracula
  plugins:
    "github@openai-curated":
      enabled: true
pi:
  settings:
    theme: dark
    defaultProvider: openai-codex
    defaultModel: gpt-5.5
    defaultThinkingLevel: medium
    packages:
      - npm:pi-subagents
      - npm:pi-web-access
      - npm:@ff-labs/pi-fff
      - npm:pi-interview
  subagent_config:
      agentOverrides:
        scout:
          model: openai-codex/gpt-5.4-mini
          thinking: low
        delegate:
          model: openai-codex/gpt-5.4-mini
          thinking: medium
        researcher:
          model: openai-codex/gpt-5.4-mini
          thinking: medium
        context-builder:
          model: openai-codex/gpt-5.4
          thinking: medium
        planner:
          model: openai-codex/gpt-5.5
          thinking: high
        worker:
          model: openai-codex/gpt-5.5
          thinking: medium
        reviewer:
          model: openai-codex/gpt-5.5
          thinking: high
        oracle:
          model: openai-codex/gpt-5.5
          thinking: high
claude:
  settings:
    statusLine:
      type: command
      command: ccstatusline
      padding: 0
      refreshInterval: 10
    attribution:
      commit: ""
      pr: ""
    hooks:
      SessionStart:
        - hooks:
            - command: bash '/home/mark/.claude/hooks/herdr-agent-state.sh' session
              timeout: 10
              type: command
          matcher: "*"

extra_folders:
  - path: ~/workspace
    group: knowledge-and-artifacts
    summary: Workspace root
    signals: [cross-repository work, specifications, knowledge]
    description: Workspace root for cross-repository project work and shared specifications, knowledge, references, artifacts, and scratch material.
  - path: ~/workspace/repos/mfz-home
    group: agent-tooling
    summary: Personal Mindframe-Z home
    signals: [Mindframe-Z, Personal profile, agent configuration]
    description: Personal mindframe-z home for shared base and Personal profile configuration.
  - path: ~/.mindframe-z
    group: agent-tooling
    summary: Generated Mindframe-Z state
    signals: [Mindframe-Z, generated configuration, capability indexes]
    description: mindframe-z configuration and generated indexes.
  - path: ~/.agent/diagrams
    group: knowledge-and-artifacts
    summary: Agent diagram artifacts
    signals: [diagrams, SVG, architecture visuals]
    description: Agent diagram files and exports.
