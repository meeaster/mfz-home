name: base
description: Shared base config for all profiles.
instructions:
  - instructions/AGENTS.md
instruction_references:
  - name: browser
    path: instructions/BROWSER.md
    description: Browser automation, website interaction, authenticated Chrome, or user-managed login
  - name: personal-knowledge
    path: instructions/PERSONAL_KNOWLEDGE.md
    description: Private Personal knowledge, Session Captures, Practices, threads, or work-unit continuity
capability_groups:
  - name: agent-tooling
    title: Agent Tooling
    summary: Agent harnesses, configuration engines, workflow frameworks, and skill sources.
  - name: public-safety-aws
    title: Public Safety AWS
    summary: Public Safety AWS provisioning, images, customer deployments, and cloud operations.
  - name: public-safety-observability
    title: Public Safety Observability
    summary: Public Safety monitoring, Datadog operations, agent deployment, and observability sources.
  - name: public-safety-products
    title: Public Safety Products
    summary: Public Safety product and integration implementation repositories.
  - name: knowledge-and-artifacts
    title: Knowledge and Artifacts
    summary: Specifications, knowledge, evidence, work artifacts, and workspace coordination paths.
references:
  - opencode
  - openspec
  - mise
  - herdr
  - executor
  - mattpocock-skills
  - codex
  - openai-skills
  - openai-plugins
  - openwiki
  - buzz
thread:
  defaults:
    synthesize: claude-code:sonnet@max
    gather: claude-code:haiku@low
    discover: claude-code:haiku@low
    session_sources:
      - claude-code
      - opencode
