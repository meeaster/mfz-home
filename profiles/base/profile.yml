  context7:
    route: executor
  fff:
    agents: [opencode, claude-code, codex]
  deepwiki:
    route: executor
  openai-docs:
    route: executor
  aws-knowledge:
    route: executor
  x-docs:
    route: executor
opencode:
  config:
    lsp: true
    tools:
      websearch: true
    reference:
      opencode: https://github.com/anomalyco/opencode
    agent:
      explore:
        model: openai/gpt-5.6-luna
        variant: high
    permission:
      question: deny
      read:
        "~/.aws/**": deny
      bash:
        "*": ask
        "*/.aws/*": deny
        "*EXA_API_KEY*": deny
        "*GITHUB_TOKEN*": deny
        "*GH_TOKEN*": deny
  plugins:
    - advisor
    - delegate-general
  tui_plugins:
    - advisor
    - session-cost-tui
  commands:
    - apply-spec
    - implement-design
    - openspec-rolling-apply
    - rmslop
  agents:
    - research
  delegate_general:
    models:
      - id: openai/gpt-5.6-luna
        variants: [low, medium, high, xhigh, max]
        description: Default low-cost family for evidence gathering and well-specified execution. Use high for codebase exploration, documentation and source research, extraction, summaries, and mechanical checks. Use xhigh only when optimizing a clear implementation for lower latency or token use. Use max for most implementation, difficult but bounded investigation, and design or specification work where requirements and decision criteria are substantially settled. Escalate genuinely ambiguous design or unresolved product and architecture choices to Terra.
      - id: openai/gpt-5.6-terra
        variants: [low, medium, high, xhigh, max]
        description: Primary collaborative design family for low-evidence or ambiguous problems. Use max when the work is discovering unknowns, reframing the problem, generating genuinely distinct options, evaluating tradeoffs, challenging assumptions, or designing OpenSpec proposals and specifications before the direction is settled. Prefer Luna max once the design is bounded and ready to specify or implement. Escalate to Sol when omission risk or decision consequences justify maximum capability.
      - id: openai/gpt-5.6-sol
        variants: [low, medium, high, xhigh]
        description: Quality-first escalation family for consequential decisions, independent criticism, and the hardest ambiguous design work. Use high for high-stakes review, adjudicating competing designs, and difficult reasoning where a missed issue is expensive. Use xhigh for broad, security-sensitive, irreversible, or still-unresolved architecture and for maximum-quality design exploration. Use a fresh context and, where possible, a different model family from the artifact's author. Do not use Sol for routine retrieval or ordinary implementation.
codex:
  config:
    tui:
      status_line:
        - model-with-reasoning
        - current-dir
        - git-branch
        - context-used
        - permissions
        - approval-mode
      status_line_use_colors: true
      theme: dracula
  plugins:
    "github@openai-curated":
      enabled: true
pi:
  settings:
    theme: dark
    defaultProvider: openai-codex
    defaultModel: gpt-5.5
    defaultThinkingLevel: medium
    packages:
      - npm:pi-subagents
      - npm:pi-web-access
      - npm:@ff-labs/pi-fff
      - npm:pi-interview
  subagent_config:
      agentOverrides:
        scout:
          model: openai-codex/gpt-5.4-mini
          thinking: low
        delegate:
          model: openai-codex/gpt-5.4-mini
          thinking: medium
        researcher:
          model: openai-codex/gpt-5.4-mini
          thinking: medium
        context-builder:
          model: openai-codex/gpt-5.4
          thinking: medium
        planner:
          model: openai-codex/gpt-5.5
          thinking: high
        worker:
          model: openai-codex/gpt-5.5
          thinking: medium
        reviewer:
          model: openai-codex/gpt-5.5
          thinking: high
        oracle:
          model: openai-codex/gpt-5.5
          thinking: high
claude:
  settings:
    statusLine:
      type: command
      command: ccstatusline
      padding: 0
      refreshInterval: 10
    attribution:
      commit: ""
      pr: ""
    hooks:
      SessionStart:
        - hooks:
            - command: bash '/home/mark/.claude/hooks/herdr-agent-state.sh' session
              timeout: 10
              type: command
          matcher: "*"

extra_folders:
  - path: ~/workspace/repos/mfz-home
    description: Personal mindframe-z home for shared base and Personal profile configuration.
  - path: ~/.mindframe-z
    description: mindframe-z configuration and generated indexes.
  - path: ~/.agent/diagrams
    description: Agent diagram files and exports.
