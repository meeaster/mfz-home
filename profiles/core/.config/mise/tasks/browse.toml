["browse:install"]
description = "Install or repair the Browse binary at ~/.local/bin/browse; the relay updates it after that"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The installer writes the binary to ~/.local/bin/browse. --no-setup skips `browse install`, which would edit the agent
# MCP configs and .zshrc that mfz renders. Pairing with Windows Chrome is a separate `browse pair`, because setup
# cannot find a Windows browser from WSL.
curl -fsSL https://opencode.ai/browse/install | bash -s -- --no-setup

echo "browse: $(browse --version) at $(command -v browse)"
echo "browse: if Chrome is not paired yet, add Browse from the Chrome Web Store and run 'browse pair'"
'''
