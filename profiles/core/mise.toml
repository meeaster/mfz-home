[tools]
node = "26"
gh = "2"
jq = "1"
ripgrep = "15"
pnpm = "12"
# The firewall binary itself, pinned; ~/.local/bin/mise-guard/mise routes installs through it.
"github:SocketDev/sfw-free" = { version = "1", bin = "sfw" }
bat = "0"
"aqua:sharkdp/fd" = "10"

[hooks]
# Runs after every `mise install`, even with nothing to install, so only install Browse when it is missing;
# its relay keeps it updated after that. Check the installed file, not the command name: xdg-utils ships an
# unrelated /usr/bin/browse.
postinstall = "test -x \"$HOME/.local/bin/browse\" || mise run browse:install"

[settings]
minimum_release_age = "1d"
# Skipped in non-interactive sessions, so agent-run installs never update mise mid-command.
self_update.auto = true
# Installs run only through ~/.local/bin/mise-guard/mise, which routes package downloads through sfw.
auto_install = false

[settings.npm]
package_manager = "pnpm"

