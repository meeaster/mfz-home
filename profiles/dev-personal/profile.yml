name: dev-personal
extends: dev
description: Personal AI setup with Home Assistant integrations.
capability_groups:
  - name: personal-trading
    summary: Personal trading alerts, market-data ingestion, and stock analysis knowledge.
instructions:
  - instructions/personal.md
instruction_references:
  - name: artifact-sharing
    path: instructions/artifact_sharing.md
    description: When the user asks to put a viewable artifact in the share folder or for a shareable link
thread:
  stores:
    - name: personal-knowledge
      root: ~/workspace/knowledge/personal-knowledge
      path: threads
      publication:
        mode: pull-request
        base: main
        auto_merge: true
      default: true
  defaults:
    discover: opencode:openai/gpt-6-luna@medium
    gather: opencode:openai/gpt-6-luna@high
    synthesize: opencode:openai/gpt-6-sol@medium
    digest: opencode:openai/gpt-6-sol@high
agents: [opencode, claude-code, codex, pi]
references:
  - opencode-plugins
  - openwiki
repos: [workspace-specs, personal-knowledge, personal-sources, personal-work]
# Hand-written Executor apps from executor/apps/; deploy with mfz executor apply.
executor:
  apps: [opencode, discord-mentions]
extra_folders:
  - path: ~/workspace/worktrees
    group: knowledge-and-artifacts
    summary: Disposable worktrees
    signals: [Git worktree, isolated implementation, prototype]
    description: "Disposable Git worktrees for isolated project work across workspace repositories."
skills:
  agent-desktop:
    agents: { opencode: true, claude-code: false, codex: false }

mcp:
  doop:
    # svc:doop Tailscale Service hosted by Grif; TAILNET comes from ~/.mindframe-z/secrets/zsh.env.
    url: https://doop.{env:TAILNET}/mcp
  x-docs:
    agents: [opencode]
  executor-lab:
    agents: [opencode]
  homeassistant:
    agents: [opencode]
  unifi-network:
    agents: [opencode]
  robinhood:
    agents: [opencode]
  sentry:
    agents: [opencode]
  cloudflare:
    agents: [opencode]
  cloudflare-docs:
    agents: [opencode]
claude:
  settings:
    permissions:
      defaultMode: auto
    syncClaudeAiSkills: false
    env:
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
    enabledPlugins:
      plannotator@plannotator: false
codex:
  plugins:
    "github@openai-curated":
      enabled: false
opencode:
  plugins:
    - optchat
    - advisor
    # Disabled until tested further.
    # - plannotator
  plugin_options:
    # Only Opus sessions get an advisor (Fable 5.2), consulted on its own judgment. Models without a rule get none;
    # the manual default applies to any rule added without its own trigger.
    advisor:
      trigger: manual
      advisors:
        - executor: claude-agent/opus
          model: claude-agent/fable#medium
          trigger: auto
    # Temporary: logs each turn's prompt parts to ~/.local/share/optchat/plugin.log to diagnose cache misses.
    optchat:
      logTurns: true
  config:
    agents:
      title:
        model: openai/gpt-6-luna
