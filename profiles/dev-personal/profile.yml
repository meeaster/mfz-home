name: dev-personal
extends: dev
description: Personal AI setup with Home Assistant integrations.
capability_groups:
  - name: personal-trading
    summary: Personal trading alerts, market-data ingestion, and stock analysis knowledge.
instructions:
  - instructions/personal.md
instruction_references:
  - name: artifact-sharing
    path: instructions/artifact_sharing.md
    description: When the user asks to put a viewable artifact in the share folder or for a shareable link
thread:
  stores:
    - name: personal-knowledge
      root: ~/workspace/knowledge/personal-knowledge
      path: threads
      publication:
        mode: pull-request
        base: main
        auto_merge: true
      default: true
  defaults:
    discover: opencode:openai/gpt-6-luna@medium
    gather: opencode:openai/gpt-6-luna@high
    synthesize: opencode:openai/gpt-6-sol@medium
    digest: opencode:openai/gpt-6-sol@high
agents: [opencode, claude-code, codex, pi]
references:
  - opencode-plugins
  - openwiki
repos: [workspace-specs, personal-knowledge, personal-sources, personal-work]
# Hand-written Executor apps from executor/apps/; deploy with mfz executor apply.
executor:
  apps: [opencode, discord-mentions]
extra_folders:
  - path: ~/workspace/worktrees
    group: knowledge-and-artifacts
    summary: Disposable worktrees
    signals: [Git worktree, isolated implementation, prototype]
    description: "Disposable Git worktrees for isolated project work across workspace repositories."
skills:
  session-brief:
    agents: { opencode: false, claude-code: false, codex: false }
  session-derived-knowledge:
    agents: { opencode: false, claude-code: false, codex: false }
  effect:
    agents: { opencode: true, claude-code: true, codex: true }
  tradingview:
    agents: { opencode: true, claude-code: true, codex: true }
  xurl:
    agents: { opencode: false, claude-code: false, codex: false }
  home-assistant-best-practices:
    agents: { opencode: false, claude-code: false, codex: false }
  open-pencil:
    agents: { opencode: true, claude-code: true, codex: false }
  open-pencil-design:
    agents: { opencode: false, claude-code: false, codex: false }
  open-pencil-drive:
    agents: { opencode: true, claude-code: true, codex: false }
  agent-desktop:
    agents: { opencode: true, claude-code: true, codex: true }
mcp:
  x-docs:
    agents: [opencode, claude-code, codex]
  homeassistant:
    agents: [opencode, claude-code]
  unifi-network:
    agents: [opencode, claude-code]
  robinhood:
    agents: [opencode, claude-code, codex]
  sentry:
    agents: [opencode, claude-code, codex]
  cloudflare:
    agents: [opencode, claude-code, codex]
  cloudflare-docs:
    agents: [opencode, claude-code, codex]
  pencil:
    agents:
      enabled: [claude-code]
      disabled: [opencode, codex]
  openpencil:
    agents:
      enabled: [claude-code]
      disabled: [opencode]
claude:
  settings:
    permissions:
      defaultMode: auto
opencode:
  plugins:
    - optchat
    # Disabled until tested further.
    # - plannotator
  plugin_options:
    # Temporary: logs each turn's prompt parts to ~/.local/share/optchat/plugin.log to diagnose cache misses.
    optchat:
      logTurns: true
  config:
    agents:
      compaction:
        model: openai/gpt-6-luna#max
      title:
        model: openai/gpt-6-luna
