name: dev
extends: core
description: Shared development config for workstations and servers.
instruction_references:
  - name: video-editing
    path: instructions/video_editing.md
    description: Before FFmpeg video processing or encoding, or Psychopomp or fframes rendering
  - name: browser
    path: instructions/browser.md
    description: Before any task involving a browser, including opening a page for the user to view, frontend UI verification, or browser automation
  - name: personal-knowledge
    path: instructions/personal_knowledge.md
    description: Private Personal knowledge, Session Captures, Practices, threads, or work-unit continuity
  - name: explanatory-artifacts
    path: instructions/explanatory_artifacts.md
    description: Before creating or revising an explanatory page, visual artifact, or diagram, including with diagram-design
  - name: github-actions
    path: instructions/github_actions.md
    description: Before creating or changing GitHub Actions workflows or actions
  - name: opencode-session-api
    path: instructions/opencode_session_api.md
    description: In OpenCode, before moving the session to another directory or compacting it on request
capability_groups:
  - name: agent-tooling
    title: Agent Tooling
    summary: Agent harnesses, configuration engines, workflow frameworks, and skill sources.
  - name: knowledge-and-artifacts
    title: Knowledge and Artifacts
    summary: Specifications, knowledge, evidence, work artifacts, and workspace coordination paths.
  - name: motion-graphics
    title: Motion Graphics
    summary: Code-first motion graphics, explainer videos, and rendered presentation backgrounds.
repos: [mfz-home, mindframe-z, cairn, psychopomp]
references:
  - opencode
  - openspec
  - openevals
  - mise
  - executor
  - mattpocock-skills
  - codex
  - openai-skills
  - openai-plugins
  - cursor-plugins
thread:
  defaults:
    synthesize: claude-code:sonnet@max
    gather: claude-code:haiku@low
    discover: claude-code:haiku@low
    session_sources:
      - claude-code
      - opencode
