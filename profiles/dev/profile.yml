mcp:
  # Self-hosted Doop at localhost; dev-personal reaches it over Tailscale instead.
  doop:
    agents: [opencode, claude-code, codex]
  github:
    agents: [opencode]
  agent-browser:
    agents: [opencode]
  context7:
    agents: [opencode]
  openai-docs:
    agents: [opencode]
  aws-knowledge:
    agents: [opencode]
  shadcn:
    agents: [opencode]
  executor:
    agents: [opencode]
  # Narrows core's route to OpenCode only.
  browse:
    agents: [opencode]
opencode:
  # OpenCode always loads ~/.claude/skills and ~/.agents/skills, including the claude.ai skills synced into
  # ~/.claude/skills/synced. Skill permissions match names, not folders, so deny the synced names and any mfz
  # skill enabled for Claude Code or Codex but not OpenCode.
  permissions:
    # OpenCode uses the agent-browser MCP server with Code Mode instead.
    - action: skill
      resource: agent-browser
      effect: deny
    - action: skill
      resource: built-in-browser
      effect: deny
    - action: skill
      resource: chrome-browser
      effect: deny
    - action: skill
      resource: computer-use
      effect: deny
    - action: skill
      resource: deep-research
      effect: deny
    - action: skill
      resource: docs
      effect: deny
    - action: skill
      resource: docx
      effect: deny
    - action: skill
      resource: google-workspace
      effect: deny
    - action: skill
      resource: import-memory
      effect: deny
    - action: skill
      resource: morning
      effect: deny
    - action: skill
      resource: pdf
      effect: deny
    - action: skill
      resource: pptx
      effect: deny
    - action: skill
      resource: xlsx
      effect: deny
  config:
    experimental:
      subagent_depth: 3
      artifacts: true
    agents:
      # Orchestrate dispatches every role to general; implementers, operators, and writers dispatch nested roles.
      general:
        permissions:
          - action: subagent
            resource: general
            effect: allow
      explore:
        model: openai/gpt-6-luna#high
        permissions:
          - action: skill
            resource: learnings
            effect: allow
          # OpenCode exposes the Cairn plugin's catalog tools through code mode's execute tool, which the built-in
          # explore agent denies. Each tool called inside execute still checks its own rule, so only the Cairn search
          # below opens up.
          - action: execute
            resource: "*"
            effect: allow
          - action: cairn_catalog_find
            resource: "*"
            effect: allow
          # Rendered extra folders add edit allows to every agent after its built-in rules, so deny edits again here.
          - action: edit
            resource: "*"
            effect: deny
          # Each subagent writes its result notes and learnings in its own folder under the Cairn root.
          - action: edit
            resource: ~/.local/state/cairn/*
            effect: allow
  websearch:
    provider: exa
  cli:
    plugins:
      # session-usage's TUI part replaces OpenCode's built-in Context box in the sidebar.
      - "-opencode.sidebar.context"
  plugins:
    - session-usage
    - session-context
    - cairn
  commands:
    - apply-spec
    - implement-design
    - openspec-rolling-apply
    - rmslop
  agents:
    - scheduled-worker
codex:
  config:
    tui:
      status_line:
        - model-with-reasoning
        - current-dir
        - git-branch
        - context-used
        - permissions
        - approval-mode
      status_line_use_colors: true
      theme: dracula
  plugins:
    "github@openai-curated":
      enabled: true
pi:
  settings:
    theme: dark
    defaultProvider: openai-codex
    defaultModel: gpt-5.5
    defaultThinkingLevel: medium
    packages:
      - npm:pi-subagents
      - npm:pi-web-access
      - npm:@ff-labs/pi-fff
      - npm:pi-interview
  subagent_config:
      agentOverrides:
        scout:
          model: openai-codex/gpt-5.4-mini
          thinking: low
        delegate:
          model: openai-codex/gpt-5.4-mini
          thinking: medium
        researcher:
          model: openai-codex/gpt-5.4-mini
          thinking: medium
        context-builder:
          model: openai-codex/gpt-5.4
          thinking: medium
        planner:
          model: openai-codex/gpt-5.5
          thinking: high
        worker:
          model: openai-codex/gpt-5.5
          thinking: medium
        reviewer:
          model: openai-codex/gpt-5.5
          thinking: high
        oracle:
          model: openai-codex/gpt-5.5
          thinking: high
claude:
  settings:
    statusLine:
      type: command
      command: ccstatusline
      padding: 0
      refreshInterval: 10
    attribution:
      commit: ""
      pr: ""
    syncClaudeAiSkills: true
    # Cairn's skills, loaded in place from its checkout, so skill edits apply at the next session or /reload-plugins.
    # Its hooks and MCP server stay below until the plugin carries them.
    extraKnownMarketplaces:
      cairn:
        source:
          source: directory
          path: "{repo:cairn}"
    enabledPlugins:
      cairn@cairn: true
    # The built-in agents-md plugin defaults to loading AGENTS.md only in projects without a CLAUDE.md.
    # Load nested AGENTS.md files beside CLAUDE.md too; files CLAUDE.md already imports aren't loaded twice.
    pluginConfigs:
      agents-md@builtin:
        options:
          instructionFiles: claude-md-and-agents-md
    hooks:
      SessionStart:
        - hooks:
            - command: bash "$HOME/.claude/hooks/herdr-agent-state.sh" session
              timeout: 10
              type: command
          matcher: "*"
        - hooks:
            - command: cairn hook claude-code
              timeout: 10
              type: command
      SubagentStart:
        - hooks:
            - command: cairn hook claude-code
              timeout: 10
              type: command
      SubagentStop:
        - hooks:
            - command: cairn hook claude-code
              timeout: 10
              type: command
      PostToolUse:
        - matcher: Write|Edit|MultiEdit|NotebookEdit|Skill
          hooks:
            - command: cairn hook claude-code
              timeout: 10
              type: command
        - matcher: Read
          hooks:
            - command: cairn hook claude-code
              timeout: 10
              type: command
              async: true
      Stop:
        - hooks:
            - command: cairn hook claude-code
              timeout: 10
              type: command

extra_folders:
  - path: ~/workspace
    group: knowledge-and-artifacts
    summary: Workspace root
    signals: [cross-repository work, specifications, knowledge]
    description: Workspace root for cross-repository project work and shared specifications, knowledge, references, artifacts, and scratch material.
  - path: ~/.mindframe-z
    group: agent-tooling
    summary: Generated Mindframe-Z state
    signals: [Mindframe-Z, generated configuration, capability indexes]
    description: mindframe-z configuration and generated indexes.
  - path: ~/.agent/diagrams
    group: knowledge-and-artifacts
    summary: Agent diagram artifacts
    signals: [diagrams, SVG, architecture visuals]
    description: Agent diagram files and exports.
