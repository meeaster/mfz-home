# Slim standalone profile; dev-personal remains available as rollback.
# OpenCode is omitted from agents so MFZ renders no OpenCode configuration; the office supplies it.
name: office-host
description: Office host bootstrap and machine-local access rules. The personal office owns the shell and toolchain.
agents:
  - claude-code
  - codex
extra_folders:
  - path: ~/office/builder/repos/mfz-home
    description: Personal mindframe-z home for shared base and Personal profile configuration.
    url: https://github.com/meeaster/mfz-home
    read: allow
    edit: allow
  - path: ~/office/builder/repos/mindframe-z
    description: "TypeScript engine behind mfz: CLI, manifest schemas, profile resolution, harness renderers, and workspace setup."
    url: https://github.com/meeaster/mindframe-z
    read: allow
    edit: allow
  - path: ~/workspace
    description: Workspace root for cross-repository project work and shared specifications, knowledge, references,
      artifacts, and scratch material.
    read: allow
    edit: allow
  - path: ~/.mindframe-z
    description: mindframe-z configuration and generated indexes.
    read: allow
    edit: allow
  - path: ~/.agent/diagrams
    description: Agent diagram files and exports.
    read: allow
    edit: allow
  - path: ~/workspace/worktrees
    description: Disposable Git worktrees for isolated project work across workspace repositories.
    read: allow
    edit: allow
