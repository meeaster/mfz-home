[tools]
node = "26"
websocat = "1"
usage = "3"
"github:xdevplatform/xurl" = "1"

[tools."github:truenas/truenas-mcp"]
version = "0.0.6"
asset_pattern = "truenas-mcp-linux-amd64.tar.gz"
bin = "truenas-mcp"

[tools."pipx:unifi-network-mcp"]
version = "0.27.1"
uvx = false

[env]
OPENCODE_ADVISOR_MODE = "auto"
OPENCODE_ADVISOR_MODELS = "opencode:openai/gpt-5.6-sol@high"
# OPENCODE_ADVISOR_MODELS = "opencode:openai/gpt-5.6-sol@high,claude-code:opus@high"
