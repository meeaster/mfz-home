name: personal
extends: base
description: Personal AI setup with Home Assistant integrations.
capability_groups:
  - name: personal-trading
    summary: Personal trading alerts, market-data ingestion, and stock analysis knowledge.
instructions:
  - instructions/PERSONAL.md
thread:
  stores:
    - name: personal-knowledge
      root: ~/workspace/knowledge/personal-knowledge
      path: threads
      publication:
        mode: pull-request
        base: main
        auto_merge: true
      default: true
  defaults:
    discover: opencode:openai/gpt-6-luna@medium
    gather: opencode:openai/gpt-6-luna@high
    synthesize: opencode:openai/gpt-6-sol@medium
    digest: opencode:openai/gpt-6-sol@high
agents: [opencode, claude-code, codex, pi]
references:
  - axis
  - deepagents
  - deepagentsjs
  - vercel-ai
  - eve
  - opencode-plugins
extra_folders:
  - path: /home/mark/workspace/specs/workspace-specs
    group: knowledge-and-artifacts
    summary: Workspace specifications
    signals: [OpenSpec, cross-project specifications, task ledgers]
    description: Machine-wide OpenSpec store for cross-project proposals, specifications, and task ledgers.
  - path: /home/mark/workspace/knowledge/personal-knowledge
    group: knowledge-and-artifacts
    summary: Personal knowledge
    signals: [Personal knowledge, Practices, Session Captures]
    description: "Private Personal knowledge: accepted synthesis, Practices, Session Capture boundaries, threads, and ledgers."
  - path: /home/mark/workspace/knowledge/personal-sources
    group: knowledge-and-artifacts
    summary: Personal source evidence
    signals: [Personal sources, voice notes, Session Captures]
    description: "Private Personal source evidence: immutable voice notes and canonical append-only Session Captures."
  - path: ~/workspace/worktrees
    group: knowledge-and-artifacts
    summary: Disposable worktrees
    signals: [Git worktree, isolated implementation, prototype]
    description: "Disposable Git worktrees for isolated project work across workspace repositories."
skills:
  session-brief:
    agents: { opencode: false, claude-code: false, codex: false }
  session-derived-knowledge:
    agents: { opencode: false, claude-code: false, codex: false }
  effect:
    agents: { opencode: true, claude-code: true, codex: true }
  shadcn:
    agents: { opencode: true, claude-code: true, codex: true }
  tradingview:
    agents: { opencode: true, claude-code: true, codex: true }
  home-assistant-best-practices:
    agents: { opencode: false, claude-code: false, codex: false }
mcp:
  shadcn:
    agents: [opencode, claude-code, codex]
  x-docs:
    agents: [opencode, claude-code, codex]
  homeassistant:
    agents: [opencode]
  unifi-network:
    agents:
      disabled: [opencode]
  robinhood:
    agents: [opencode, claude-code, codex]
  sentry:
    agents: [opencode, claude-code, codex]
  cloudflare:
    agents: [opencode, claude-code, codex]
  cloudflare-docs:
    agents: [opencode, claude-code, codex]
  discord:
    agents: [opencode]
  pencil:
    agents: [opencode, claude-code, codex]
claude:
  settings:
    permissions:
      defaultMode: auto
opencode:
  config:
    agents:
      compaction:
        model: openai/gpt-6-luna#max
      worker:
        model: openai/gpt-6-sol#medium
      operator:
        model: openai/gpt-6-sol#medium
      agent-author:
        model: openai/gpt-6-sol#medium
      architect:
        model: openai/gpt-6-astra#medium
      prototype:
        model: openai/gpt-6-sol#high
      reviewer:
        model: openai/gpt-6-astra#medium
      triage:
        model: openai/gpt-6-sol#high
      orchestrator:
        model: openai/gpt-6-sol#medium
