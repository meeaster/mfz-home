name: personal
extends: base
description: Personal AI setup with Home Assistant integrations.
instructions:
  - instructions/PERSONAL.md
thread:
  stores:
    - name: personal-knowledge
      root: ~/workspace/knowledge/personal-knowledge
      path: threads
      publication:
        mode: pull-request
        base: main
        auto_merge: true
      default: true
  defaults:
    discover: opencode:openai/gpt-5.6-luna@medium
    gather: opencode:openai/gpt-5.6-luna@medium
    synthesize: opencode:openai/gpt-5.6-terra@medium
    digest: opencode:openai/gpt-5.6-sol@high
agents: [opencode, claude-code, codex, pi]
references:
  - axis
  - deepagents
  - deepagentsjs
  - vercel-ai
  - eve
  - buzz
extra_folders:
  - path: /tmp/compound-engineering
    description: Compound Engineering temporary scratch files for brainstorm grounding and repository profiles
  - path: /home/mark/workspace/specs/workspace-specs
    description: Machine-wide OpenSpec store for cross-project change proposals, specifications, and task ledgers — needed when planning or implementing workspace work
  - path: /home/mark/workspace/knowledge/personal-knowledge
    description: Private Personal knowledge containing accepted wiki synthesis, reasoned Practices, lightweight Session Captures, retrospective thread evidence, and work-unit continuity context
skills:
  home-assistant-best-practices:
    agents: { opencode: false, claude-code: false, codex: false }
mcp:
  homeassistant:
    agents: { enabled: [claude-code], disabled: [opencode, codex] }
  robinhood-trading:
    route: executor
    connections:
      main: oauth
claude:
  settings:
    permissions:
      defaultMode: auto
opencode:
  plugins:
    - current-session
    - work-context
  tui_plugins:
    - work-context
  config:
    permission:
      read:
        "~/.xurl": deny
      edit:
        "~/.xurl": deny
      bash:
        "*": allow
    agent:
      explore:
        model: openai/gpt-5.6-luna
        variant: high
      compaction:
        model: openai/gpt-5.6-luna
        variant: max
      research:
        model: openai/gpt-5.6-luna
        variant: high
